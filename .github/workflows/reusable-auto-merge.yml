# Reusable auto-merge workflow — PUBLIC HOST copy.
#
# This is the public-repo-consumable copy of the reusable that also lives in the
# private `devops-excellence` repo. GitHub does not allow a PUBLIC repo to call
# a reusable workflow — or a composite action — in a PRIVATE repo (the call
# fails at startup with 0 jobs), so public `*-claude-plugin` repos must
# reference THIS host. See devops-excellence ADR-045 (the decision to route a
# 1Password token + App PEM through public Actions) and ADR-038 (the public-host
# pattern), plus devops-excellence#192 / #189.
#
# Two paths fire from a single workflow:
#   1. Dependabot PRs: patch and minor bumps are queued for auto-merge; major
#      bumps always require human review.
#   2. `claude/*` branches: Claude Code-authored PRs are queued for auto-merge.
#
# Both mint a GitHub App token (not GITHUB_TOKEN) so the auto-merge re-triggers
# downstream workflows that assert on a real actor identity.
#
# Credential surface (differs from the private copy — read carefully)
# -------------------------------------------------------------------
# The private copy forwards `OP_SERVICE_ACCOUNT_TOKEN`, which is read-only on
# the WHOLE `ip-automation` vault. Forwarding that to a PUBLIC runner is an
# unacceptable blast radius (a leak reads every App PEM, including the
# org-admin `ip-org-writer`). Per ADR-045 this public copy forwards a SCOPED
# token instead:
#
#   secrets.OP_AUTOMERGE_PUBLIC_TOKEN — a 1Password service-account token
#     scoped read-only to the `ip-automation-public` vault, which holds ONLY a
#     copy of the ip-automerge PEM. (1P service accounts are vault-scoped, not
#     item-scoped, so the scoped PEM lives in its own vault — ip-bots ADR-003.)
#     A leak mints only ip-automerge (contents/pull_requests:write).
#     Provisioned by ip-bots#207 (the precondition for this path going live).
#
# The token is declared `required: false` on purpose: GitHub's workflow_call
# validator rejects an empty `required: true` secret at startup, producing the
# opaque 0-second startup_failure (the failure mode reusable-claude.yml hit when
# its caller landed before the secret existed). With `required: false`, a
# missing/empty token reaches the PEM step instead of killing the run at
# startup, so the failure is reported as a legible `::error::` with remediation
# rather than an unexplained 0-second abort. It is still a failure — see the
# failure contract below.
#
# Caller secrets block:
#   secrets:
#     OP_AUTOMERGE_PUBLIC_TOKEN: ${{ secrets.OP_AUTOMERGE_PUBLIC_TOKEN }}
#     OP_LABELER_PUBLIC_TOKEN: ${{ secrets.OP_LABELER_PUBLIC_TOKEN }}
#
# The PEM read is centralized in the PUBLIC `read-pem-from-1p` composite action
# in this repo, referenced by full public path (public->public, which the
# devops-excellence public-private-reusable fitness check permits). The
# token-minting actions are SHA-pinned per ADR-045.
#
# A SECOND scoped token, `OP_LABELER_PUBLIC_TOKEN`, follows the identical
# ADR-045 pattern but for the `ip-labeler` PEM (devops-excellence#519 /
# ADR-075): scoped read-only to its own dedicated `ip-labeler-public` vault
# (never the same vault as OP_AUTOMERGE_PUBLIC_TOKEN — 1P service accounts are
# vault-scoped, not item-scoped, so sharing a vault would let either token read
# both PEMs). It powers ONLY the `close-linked-issues` job below, which mints
# an `ip-labeler` token (issues:write) — `ip-automerge` deliberately holds
# none, per ip-bots ADR-026, so the merge identity can never close the issues
# it merges. A leak of this token mints only `ip-labeler` (issues:write).
#
# Failure contract (changed by issues #17 / #23 — read before editing a guard)
# ---------------------------------------------------------------------------
# This workflow does not block a PR because it is never a REQUIRED status check
# on any consumer — that, not an unconditional `exit 0`, is the mechanism.
# Verified across all 51 consuming repos, via both repository rulesets and
# classic branch protection: zero list an auto-merge context as required. A
# required-check misconfiguration in one consumer is a one-line fix; a swallowed
# exit code is invisible by construction. Issue #24 turns that sweep into an
# enforced check rather than a point-in-time reading.
#
# Given that, a job ends RED whenever auto-merge was supposed to arm and did not:
#   * the 1Password PEM read failed — missing/empty OP_AUTOMERGE_PUBLIC_TOKEN, or
#     this repo absent from the org secret's selected-repositories list
#   * actions/create-github-app-token failed despite a good PEM
#   * `gh pr merge --auto` exited non-zero, or returned success while the PR's
#     `autoMergeRequest` stayed unset (e.g. "Allow auto-merge" is off on the repo)
# Each emits `::error::` carrying its remediation, then exits 1.
#
# A job stays GREEN with a `::warning::` only where skipping is the intended
# outcome rather than a malfunction:
#   * vars.IP_AUTOMERGE_APP_ID / _APP_CLIENT_ID unset — the ip-automerge App is
#     not provisioned for this repo at all, a legitimate opt-out state
#   * dependabot/fetch-metadata could not verify the PR's commits (#16 / #18)
#   * the bump is semver-major — human review is required by design
#
# Why not `exit 0` unconditionally, as this file did until #17: the old guard
# tested `steps.app-token.outcome == 'failure'`, but a step skipped by its own
# `if:` reports `skipped`, not `failure`. So when the PEM read failed the guard
# could never fire, every step that ran succeeded, and the job went green with
# nothing armed and no annotation. Guards below therefore use `!cancelled()` and
# assert on the outcome of the step that actually failed. The real quality gates
# remain the consumer's own CI checks.
#
# YAML footgun, if you edit a guard: `if: !cancelled() && …` does NOT parse. A
# leading `!` opens a YAML tag and the following `&&` is then read as an anchor,
# so the whole file dies before Actions ever evaluates it. Single-line guards are
# therefore written `if: ${{ !cancelled() && … }}`. Inside a `|` block scalar the
# indicators are inert, so the multi-line guard is left bare — matching the
# `Generate App token` steps. Do not "tidy" either form into the other.

name: Reusable Auto-Merge

on:
  workflow_call:
    secrets:
      OP_AUTOMERGE_PUBLIC_TOKEN:
        description: 'Scoped 1Password service-account token, read-only on the ip-automation-public vault (which holds ONLY the ip-automerge PEM) per ADR-045 / ip-bots#207. Declared required:false so a missing token degrades gracefully instead of a 0-second startup_failure; the PEM read fails closed.'
        required: false
      OP_LABELER_PUBLIC_TOKEN:
        description: 'Scoped 1Password service-account token, read-only on the ip-labeler-public vault (which holds ONLY the ip-labeler PEM) per ADR-075 / devops-excellence#519. Powers the close-linked-issues job only. Declared required:false so a missing token degrades gracefully (that job emits a warning and skips) instead of a 0-second startup_failure.'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Auto-merge Dependabot (patch/minor)
    runs-on: ubuntu-latest
    # `github.event.action != 'closed'` added alongside the `closed` event type
    # (devops-excellence#519, so close-linked-issues below can run) — without
    # this exclusion a closed/merged Dependabot PR would re-enter this job and
    # attempt `gh pr merge --auto` on an already-merged PR, failing loudly for
    # no reason. Mirrors the private copy's identical guard.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.action != 'closed'
    steps:
      - name: Verify org variable identifiers are configured
        id: app_id_check
        # APP_ID + CLIENT_ID are org variables (ADR-005), accessible in any
        # scope. See orgops#131 (origin of the precheck pattern) and issue #37.
        env:
          APP_ID: ${{ vars.IP_AUTOMERGE_APP_ID }}
          CLIENT_ID: ${{ vars.IP_AUTOMERGE_APP_CLIENT_ID }}
        run: |
          missing=0
          if [ -z "${APP_ID:-}" ]; then
            echo "::warning::vars.IP_AUTOMERGE_APP_ID is not set on this repo or the org. Fix: gh variable set IP_AUTOMERGE_APP_ID --org Integral-Productivity --visibility all --body '<numeric-app-id>'"
            missing=1
          fi
          if [ -z "${CLIENT_ID:-}" ]; then
            echo "::warning::vars.IP_AUTOMERGE_APP_CLIENT_ID is not set on this repo or the org. Fix: gh variable set IP_AUTOMERGE_APP_CLIENT_ID --org Integral-Productivity --visibility all --body '<Iv23li...>'"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::warning::Skipping auto-merge — required org variable identifiers are missing. See warnings above."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read auto-merge App PEM from 1Password
        id: pem
        if: steps.app_id_check.outputs.ready == 'true'
        continue-on-error: true
        # `continue-on-error: true` is kept so the failure is reported by the
        # guard below — which carries the remediation — rather than by this
        # action's raw output. It does NOT mean the failure is tolerated: the
        # guard exits 1. See the failure contract in the header.
        uses: Integral-Productivity/reusable-workflows/.github/actions/read-pem-from-1p@main
        with:
          op-service-account-token: ${{ secrets.OP_AUTOMERGE_PUBLIC_TOKEN }}
          item-path: op://ip-automation-public/ip-automerge/private_key

      - name: Assert the App PEM was read
        # `!cancelled()` is load-bearing (#17). Any status-check function here
        # replaces the implicit `success() &&`, so this step still runs after an
        # upstream step fails or is SKIPPED — and a step skipped by its own `if:`
        # reports outcome `skipped`, not `failure`, which is exactly what the old
        # guard could not see. Asserting on the PEM step's own outcome, rather
        # than on the token step it gates, is the actual fix. `!cancelled()`
        # rather than `always()` so cancelling a run doesn't stamp a spurious
        # error on it.
        if: ${{ !cancelled() && steps.app_id_check.outputs.ready == 'true' && steps.pem.outcome != 'success' }}
        run: |
          echo "::error::Could not read the ip-automerge App PEM from 1Password (op://ip-automation-public/ip-automerge/private_key) — auto-merge was NOT armed on this PR. Most likely secrets.OP_AUTOMERGE_PUBLIC_TOKEN is unset or empty on this repo, or this repo is missing from the org secret's selected-repositories list. Fix: gh secret set OP_AUTOMERGE_PUBLIC_TOKEN --org Integral-Productivity --repos <this-repo>. See ADR-045 and ip-bots#207."
          exit 1

      - name: Fetch Dependabot metadata
        id: meta
        # `dependabot/fetch-metadata` refuses to proceed when a PR's commits
        # aren't cryptographically verified as Dependabot-signed (see #16/#18).
        # This is the one genuinely soft path in this job: an unverified PR is a
        # PR that SHOULD fall through to human review, not a malfunction. So it
        # stays green — `continue-on-error: true`, the mint gates on
        # steps.meta.outcome == 'success', and the reason is announced as a
        # `::warning::` by "Explain a skipped mint" below.
        if: steps.app_id_check.outputs.ready == 'true' && steps.pem.outcome == 'success'
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate App token
        id: app-token
        if: |
          steps.app_id_check.outputs.ready == 'true'
          && steps.pem.outcome == 'success'
          && steps.meta.outcome == 'success'
          && (steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor')
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.IP_AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ steps.pem.outputs.private-key }}

      - name: Assert the App token was minted
        if: ${{ !cancelled() && steps.app-token.outcome == 'failure' }}
        # Literal block scalar (`|`) so the `#14` reference isn't truncated by
        # YAML's comment parser (see devops-excellence #109 fix).
        run: |
          echo "::error::App token generation failed — the PEM was read from 1Password successfully, but actions/create-github-app-token still failed, so auto-merge was NOT armed. Check that vars.IP_AUTOMERGE_APP_CLIENT_ID is set at the org level and that the ip-automerge App is installed on this repo. See devops-excellence issue #14 for the silent-failure history."
          exit 1

      - name: Explain a skipped mint
        # The token step is also skipped for two BY-DESIGN reasons. Those stay
        # green — but they must still say so, or a Dependabot PR that quietly
        # never auto-merges looks identical to one that did.
        if: |
          !cancelled()
          && steps.app_id_check.outputs.ready == 'true'
          && steps.pem.outcome == 'success'
          && steps.app-token.outcome == 'skipped'
        env:
          META_OUTCOME: ${{ steps.meta.outcome }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          if [ "$META_OUTCOME" != "success" ]; then
            echo "::warning::dependabot/fetch-metadata did not succeed (outcome: ${META_OUTCOME}) — this PR's commits could not be verified as Dependabot-signed, so auto-merge was skipped by design. Review and merge manually. See issues #16 / #18."
          else
            echo "::warning::Update type '${UPDATE_TYPE}' is neither semver-patch nor semver-minor — auto-merge was skipped by design. Major bumps require human review."
          fi

      - name: Enable auto-merge (squash)
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if ! gh pr merge --auto --squash "$PR_URL"; then
            echo "::error::gh pr merge --auto exited non-zero — auto-merge was NOT armed on this PR. The most common cause is that 'Allow auto-merge' is disabled in this repository's settings. Fix: gh api -X PATCH repos/{owner}/{repo} -F allow_auto_merge=true"
            exit 1
          fi
          # Trust the command's exit code for nothing (#23): re-read the PR and
          # confirm auto-merge is actually queued. `gh pr merge --auto` exits 0
          # on paths that arm nothing. MERGED is also a success — when every
          # required check has already passed, --auto merges immediately and
          # leaves autoMergeRequest null.
          pr_json="$(gh pr view "$PR_URL" --json state,autoMergeRequest)"
          armed="$(printf '%s' "$pr_json" | jq -r '.autoMergeRequest != null')"
          state="$(printf '%s' "$pr_json" | jq -r '.state')"
          if [ "$armed" != "true" ] && [ "$state" != "MERGED" ]; then
            echo "::error::gh pr merge --auto reported success, but this PR's autoMergeRequest is still unset and its state is ${state} — auto-merge is NOT armed. Merge manually and investigate; this is the silent path tracked by issue #23."
            exit 1
          fi
          if [ "$state" = "MERGED" ]; then
            echo "PR is already MERGED — every required check had passed, so --auto merged it immediately."
          else
            echo "Auto-merge armed (state: ${state})."
          fi

  claude-branches:
    name: Auto-merge claude/* branches
    runs-on: ubuntu-latest
    # `github.event.action != 'closed'` added alongside the `closed` event type
    # (devops-excellence#519, so close-linked-issues below can run) — mirrors
    # the private copy's identical guard; see the Dependabot job's comment for
    # why the exclusion is needed.
    if: startsWith(github.head_ref, 'claude/') && github.event.action != 'closed'
    steps:
      - name: Verify org variable identifiers are configured
        id: app_id_check
        # Mirrors the Dependabot job's precheck — see that job for context.
        env:
          APP_ID: ${{ vars.IP_AUTOMERGE_APP_ID }}
          CLIENT_ID: ${{ vars.IP_AUTOMERGE_APP_CLIENT_ID }}
        run: |
          missing=0
          if [ -z "${APP_ID:-}" ]; then
            echo "::warning::vars.IP_AUTOMERGE_APP_ID is not set on this repo or the org. Fix: gh variable set IP_AUTOMERGE_APP_ID --org Integral-Productivity --visibility all --body '<numeric-app-id>'"
            missing=1
          fi
          if [ -z "${CLIENT_ID:-}" ]; then
            echo "::warning::vars.IP_AUTOMERGE_APP_CLIENT_ID is not set on this repo or the org. Fix: gh variable set IP_AUTOMERGE_APP_CLIENT_ID --org Integral-Productivity --visibility all --body '<Iv23li...>'"
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "::warning::Skipping auto-merge — required org variable identifiers are missing. See warnings above."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read auto-merge App PEM from 1Password
        id: pem
        if: steps.app_id_check.outputs.ready == 'true'
        continue-on-error: true
        # See the Dependabot job's identical step for why continue-on-error stays.
        uses: Integral-Productivity/reusable-workflows/.github/actions/read-pem-from-1p@main
        with:
          op-service-account-token: ${{ secrets.OP_AUTOMERGE_PUBLIC_TOKEN }}
          item-path: op://ip-automation-public/ip-automerge/private_key

      - name: Assert the App PEM was read
        # `!cancelled()` is load-bearing — see the Dependabot job's identical guard.
        if: ${{ !cancelled() && steps.app_id_check.outputs.ready == 'true' && steps.pem.outcome != 'success' }}
        run: |
          echo "::error::Could not read the ip-automerge App PEM from 1Password (op://ip-automation-public/ip-automerge/private_key) — auto-merge was NOT armed on this PR. Most likely secrets.OP_AUTOMERGE_PUBLIC_TOKEN is unset or empty on this repo, or this repo is missing from the org secret's selected-repositories list. Fix: gh secret set OP_AUTOMERGE_PUBLIC_TOKEN --org Integral-Productivity --repos <this-repo>. See ADR-045 and ip-bots#207."
          exit 1

      - name: Generate App token
        id: app-token
        if: |
          steps.app_id_check.outputs.ready == 'true'
          && steps.pem.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.IP_AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ steps.pem.outputs.private-key }}

      - name: Assert the App token was minted
        if: ${{ !cancelled() && steps.app-token.outcome == 'failure' }}
        # Literal block scalar — see Dependabot job's identical step.
        run: |
          echo "::error::App token generation failed — the PEM was read from 1Password successfully, but actions/create-github-app-token still failed, so auto-merge was NOT armed. Check that vars.IP_AUTOMERGE_APP_CLIENT_ID is set at the org level and that the ip-automerge App is installed on this repo. See devops-excellence issue #14 for the silent-failure history."
          exit 1

      - name: Enable auto-merge (squash)
        if: steps.app-token.outcome == 'success' && github.event.action != 'closed'
        # Pass --subject and --body so the PR body — including any "Closes #N"
        # keywords — lands on `main` as the squash commit body (GitHub's default
        # squash format drops the PR body, breaking auto-close of linked issues
        # when an App performs the merge; see devops-excellence ADR-020 / #32).
        #
        # PR_TITLE / PR_BODY are attacker-influenceable strings routed through
        # `env:` and referenced as "$PR_TITLE"/"$PR_BODY" — the env-var-mediated
        # form that avoids the ${{ }}->run: script-injection class (ADR-045
        # threat model). Do NOT inline-expand title/body in a run: step.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! gh pr merge --auto --squash "$PR_URL" \
            --subject "${PR_TITLE} (#${PR_NUMBER})" \
            --body "${PR_BODY}"; then
            echo "::error::gh pr merge --auto exited non-zero — auto-merge was NOT armed on this PR. The most common cause is that 'Allow auto-merge' is disabled in this repository's settings. Fix: gh api -X PATCH repos/{owner}/{repo} -F allow_auto_merge=true"
            exit 1
          fi
          # Trust the command's exit code for nothing (#23) — see the Dependabot
          # job's identical assertion for why, including why MERGED counts.
          pr_json="$(gh pr view "$PR_URL" --json state,autoMergeRequest)"
          armed="$(printf '%s' "$pr_json" | jq -r '.autoMergeRequest != null')"
          state="$(printf '%s' "$pr_json" | jq -r '.state')"
          if [ "$armed" != "true" ] && [ "$state" != "MERGED" ]; then
            echo "::error::gh pr merge --auto reported success, but this PR's autoMergeRequest is still unset and its state is ${state} — auto-merge is NOT armed. Merge manually and investigate; this is the silent path tracked by issue #23."
            exit 1
          fi
          if [ "$state" = "MERGED" ]; then
            echo "PR is already MERGED — every required check had passed, so --auto merged it immediately."
          else
            echo "Auto-merge armed (state: ${state})."
          fi

  # Public-host counterpart of devops-excellence's close-linked-issues job
  # (devops-excellence#519 / ADR-075). Mints an ip-labeler token via the scoped
  # OP_LABELER_PUBLIC_TOKEN instead of the whole-vault OP_SERVICE_ACCOUNT_TOKEN
  # the private copy uses — see the header credential-surface note above. The
  # resolve-with-retry kernel below is a VERBATIM COPY of the private job's;
  # keep the two in sync by hand (no shared test harness across repos yet). The
  # one intentional deviation is a `shellcheck disable=SC2016` comment on the
  # graphql query step — this repo's actionlint runs shellcheck as a required
  # check and the private repo's doesn't, so that line only exists here.
  close-linked-issues:
    name: Close linked issues (ip-labeler)
    runs-on: ubuntu-latest
    # Only fire when a claude/* branch PR is actually merged into the default
    # branch. Dependabot PRs don't carry manual `Closes #N` keywords and are
    # excluded. This job implements ip-bots ADR-026: ip-automerge deliberately
    # holds no issues:write, so closing must be performed by ip-labeler.
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && startsWith(github.head_ref, 'claude/')
      && github.event.pull_request.base.ref == github.event.repository.default_branch
    steps:
      - name: Resolve closing-issue references via GitHub's linked-issue graph
        id: keywords
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Retry knobs (env-overridable). GitHub populates
          # closingIssuesReferences asynchronously after merge, and this job
          # starts within seconds of the merge — so a single query can see an
          # empty set for a PR that genuinely closes an issue (#339: the SAE
          # incident; the linkage was still empty ~20s post-merge in a related
          # case). Retry with linear backoff before concluding "nothing to
          # close". Defaults: 9 attempts, 3s * attempt → up to ~108s of total
          # wait. Widened from the original 6/~45s (#350: PR #348, which
          # documented this very mechanism, hit the 45s cap in production —
          # propagation completed shortly after, but past the old window,
          # forcing a red run + manual close). This job runs post-merge and
          # blocks nothing, so the wider window only costs job runtime.
          RESOLVE_ATTEMPTS: '9'
          RESOLVE_BASE_DELAY_SECONDS: '3'
        run: |
          set -euo pipefail
          # closingIssuesReferences is populated by GitHub's own body parser —
          # the same one that decides whether a merge auto-closes an issue — so
          # it excludes code spans and negated mentions that a raw-body regex
          # would false-match (#334). We filter to same-repo issues only
          # (cross-repo `owner/repo#N` refs are left to GitHub's native
          # auto-close, since `gh issue close` below assumes $REPO).
          #
          # The repo comparison is interpolated into the --jq expression (not
          # via jq's `--arg`): `gh api`'s `--jq` flag takes a single filter
          # string and has no `--arg` support, so `--arg repo "$X" '<filter>'`
          # mis-parses into positional args and errors before any network call
          # — the bug (#340) that left #334/#337 open past their closing PRs.
          #
          # ===== VERBATIM COPY: resolve-with-retry kernel — keep identical to
          # test-close-linked-issues.yml (drift caught by that test's
          # path-trigger). In the test the `gh api graphql` call is replaced by
          # a PATH stub; everything else runs exactly as shipped. =====
          resolve_once() {
            # $owner/$repo/$pr below are GraphQL variable refs inside a
            # single-quoted -f query string, not shell expansions. This repo's
            # actionlint (unlike the private original's CI) runs shellcheck and
            # treats findings as failures, so the directive on the next line is
            # the one intentional deviation from the VERBATIM COPY note above.
            # shellcheck disable=SC2016
            gh api graphql -f query='
                query($owner: String!, $repo: String!, $pr: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $pr) {
                      closingIssuesReferences(first: 50) {
                        nodes { number repository { nameWithOwner } }
                      }
                    }
                  }
                }' \
              -f owner="$OWNER" -f repo="$REPO_NAME" -F pr="$PR_NUMBER" \
              --jq "[.data.repository.pullRequest.closingIssuesReferences.nodes[]
                  | select(.repository.nameWithOwner == \"${OWNER}/${REPO_NAME}\") | .number]
                 | sort | unique | .[]" \
              | tr '\n' ' ' | xargs
          }

          resolve_with_retry() {
            # $1=attempts $2=base_delay_seconds. Echoes the resolved issue list
            # (possibly empty). Returns a populated result immediately; only an
            # empty result is retried (absorbs propagation lag). A failed
            # `gh api` (transient network) counts as empty and is retried too.
            _attempts="$1"; _base="$2"; _result=""; _attempt=1
            while :; do
              _result="$(resolve_once || true)"
              [ -n "$_result" ] && break
              [ "$_attempt" -ge "$_attempts" ] && break
              _delay=$(( _base * _attempt ))
              echo "closingIssuesReferences empty on attempt ${_attempt}/${_attempts}; GitHub's linked-issue graph may still be propagating — retrying in ${_delay}s…" >&2
              sleep "$_delay"
              _attempt=$(( _attempt + 1 ))
            done
            printf '%s' "$_result"
          }

          body_has_same_repo_closing_keyword() {
            # Exit 0 if the PR body ($1) declares a same-repo closing keyword
            # ("Closes #N" etc. with a bare numeric ref). Used ONLY to decide
            # whether an empty resolve is suspicious — never to close (closing
            # stays on closingIssuesReferences, preserving #334). A cross-repo
            # "owner/repo#N" won't match, matching this job's same-repo scope.
            printf '%s' "${1:-}" \
              | grep -iEq '(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+'
          }
          # ===== END VERBATIM COPY =====

          ISSUES="$(resolve_with_retry "${RESOLVE_ATTEMPTS}" "${RESOLVE_BASE_DELAY_SECONDS}")"
          echo "issues=${ISSUES}" >> "$GITHUB_OUTPUT"

          if [ -n "${ISSUES}" ]; then
            echo "suspected_race=false" >> "$GITHUB_OUTPUT"
            echo "Issues to close: ${ISSUES}"
          elif body_has_same_repo_closing_keyword "${PR_BODY:-}"; then
            # Empty after retries, but the body says it should have closed
            # something → the propagation race never cleared (or a malformed
            # ref). Flag it; the next step turns this into a loud red failure
            # instead of a silent skip (#339).
            echo "suspected_race=true" >> "$GITHUB_OUTPUT"
            echo "PR body declares a same-repo closing keyword, but closingIssuesReferences resolved no issue after ${RESOLVE_ATTEMPTS} attempts."
          else
            # Genuinely no linked issue — not every claude/* PR closes one.
            echo "suspected_race=false" >> "$GITHUB_OUTPUT"
            echo "No linked closing issues found and no closing keyword in the PR body — nothing to close."
          fi

      - name: Verify ip-labeler org variable identifiers are configured
        id: labeler_check
        if: steps.keywords.outputs.issues != ''
        env:
          APP_ID: ${{ vars.IP_LABELER_APP_ID }}
          CLIENT_ID: ${{ vars.IP_LABELER_APP_CLIENT_ID }}
        run: |
          missing=0
          if [ -z "${APP_ID:-}" ]; then
            echo "::warning::vars.IP_LABELER_APP_ID is not set on this repo or the org. Cannot close linked issues. Fix: gh variable set IP_LABELER_APP_ID --org Integral-Productivity --visibility all --body '<numeric-app-id>'"
            missing=1
          fi
          if [ -z "${CLIENT_ID:-}" ]; then
            echo "::warning::vars.IP_LABELER_APP_CLIENT_ID is not set on this repo or the org. Cannot close linked issues."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read ip-labeler App PEM from 1Password
        id: pem
        if: steps.keywords.outputs.issues != '' && steps.labeler_check.outputs.ready == 'true'
        continue-on-error: true
        uses: Integral-Productivity/reusable-workflows/.github/actions/read-pem-from-1p@main
        with:
          op-service-account-token: ${{ secrets.OP_LABELER_PUBLIC_TOKEN }}
          item-path: op://ip-labeler-public/ip-labeler/private_key

      - name: Generate ip-labeler App token
        id: app-token
        if: steps.keywords.outputs.issues != '' && steps.labeler_check.outputs.ready == 'true' && steps.pem.outcome == 'success'
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.IP_LABELER_APP_CLIENT_ID }}
          private-key: ${{ steps.pem.outputs.private-key }}

      - name: Close linked issues
        if: steps.keywords.outputs.issues != '' && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUES: ${{ steps.keywords.outputs.issues }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for ISSUE in $ISSUES; do
            echo "Closing issue #${ISSUE} (linked from PR #${PR_NUMBER})"
            gh issue comment "$ISSUE" \
              --repo "$REPO" \
              --body "Closed by #${PR_NUMBER}." || \
              echo "::warning::Could not comment on issue #${ISSUE} — continuing"
            gh issue close "$ISSUE" \
              --repo "$REPO" \
              --reason completed || \
              echo "::warning::Could not close issue #${ISSUE} — continuing"
          done

      - name: Warn if a closing keyword resolved no issue (propagation race)
        if: steps.keywords.outputs.issues == '' && steps.keywords.outputs.suspected_race == 'true'
        # Emits a ::warning:: (NOT ::error:: + exit 1) so the post-merge run
        # stays GREEN. Before #396 this failed red to make the miss loud and
        # force a manual close; now the linked-issue-unclosed scan reconciles
        # it — once GitHub's closingIssuesReferences graph finishes propagating
        # (which can outlast any fixed inline retry window, #350), the daily
        # scan resolves the same graph and AUTO-CLOSES the issue (ADR-062).
        # The warning remains visible in the Checks UI for immediate awareness;
        # no human action is needed unless the scan also can't resolve it (a
        # malformed reference), which the scan surfaces separately.
        # This job runs on the pull_request `closed` event AFTER the merge, so
        # it never blocks the PR either way (the merge already happened).
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "::warning::close-linked-issues: PR #${PR_NUMBER} (${REPO}) merged with a same-repo closing keyword, but GitHub's closingIssuesReferences graph resolved no linked issue within the inline retry window — likely propagation lag (#339/#396). The linked issue may still be OPEN now; the daily linked-issue-unclosed scan will auto-close it once the graph propagates (ADR-062). Verify if needed: gh pr view ${PR_NUMBER} --repo ${REPO} --json closingIssuesReferences."
