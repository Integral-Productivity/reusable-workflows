# Reusable plugin-manifest validation gate (devops-excellence ADR-038).
#
# Gates every PR on `claude plugin validate <manifest>` so a manifest that is
# valid JSON but invalid against the Claude Code plugin schema cannot reach
# `main`. A manifest can pass `jq` and human review, get listed, and only fail
# at `claude plugin install` — this catches that class of error in CI.
#
# `claude plugin validate` is a local, auth-free schema check (no API key, no
# login), so it runs on a clean runner with no secrets.
#
# This workflow lives in a PUBLIC repo on purpose: GitHub does not allow a
# public repository to call a reusable workflow stored in a private/internal
# repository, so the *-claude-plugin repos (public) cannot consume the copy in
# the private devops-excellence repo. This public host is the canonical home.
#
# Usage in a consumer repo (one caller per repo):
#
#   name: Validate plugin manifest
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     validate:
#       uses: Integral-Productivity/reusable-workflows/.github/workflows/validate-plugin-manifest.yml@v1
#       # with:
#       #   manifest-path: .claude-plugin/marketplace.json   # default is plugin.json
#       #   upload-limits: error                              # default is warn
#
# Inputs
# ------
#
#   manifest-path  (default: .claude-plugin/plugin.json)
#     Path to the manifest to validate, relative to the repo root. Plugin
#     repos use the default; the marketplace repo passes
#     `.claude-plugin/marketplace.json`.
#
#   upload-limits  (default: warn)   one of: error | warn | off
#     Also check the limits Claude's plugin UPLOAD validator (Customize >
#     Plugins) enforces and `claude plugin validate` does not: plugin.json
#     `description` <= 500 characters; every skills/*/SKILL.md has a `name` and
#     a `description` <= 1024 characters. Upload is how a private plugin reaches
#     Claude Desktop and Chat projects on a personal plan, so without this a
#     green gate does not mean the plugin is installable there
#     (devops-excellence#777, ADR-038 decision 6). `warn` annotates the run and
#     exits 0; `error` fails the job. The default is `warn` because `@v1`
#     callers inherit this change unasked and some plugins were over a limit
#     when it shipped; it flips to `error` once they are fixed. Runs only when
#     `manifest-path` names a `plugin.json` (a marketplace manifest has no
#     upload limits). The plugin root is the parent of the manifest's directory.
#
# Permissions required from caller
# --------------------------------
#
# The caller MUST grant the permissions this file declares, since reusable
# workflows can only use permissions the caller granted:
#
#   permissions:
#     contents: read
#
# `contents: read` is all that is needed — the only privileged step is the
# checkout. `validate` makes no network calls and uses no token.

name: Reusable validate plugin manifest

on:
  workflow_call:
    inputs:
      manifest-path:
        description: "Path to the manifest to validate, relative to the repo root."
        required: false
        type: string
        default: .claude-plugin/plugin.json
      upload-limits:
        description: "Check Claude's plugin upload limits: error | warn | off."
        required: false
        type: string
        default: warn

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Latest CLI on purpose: validate against the current plugin schema so new
      # schema requirements are caught, not pinned away. Pin here if a CLI
      # release ever destabilises the gate.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      # Pass the input via env rather than interpolating ${{ inputs.* }} directly
      # into the run line, per GitHub Actions script-injection guidance: the
      # runner then treats the value as data, not as shell to evaluate.
      - name: Validate manifest
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: claude plugin validate "$MANIFEST_PATH"
      # The check runs in the CALLER's checkout, which does not contain this
      # repo's scripts/, so the script is embedded here verbatim. The tested
      # source of truth is scripts/check-upload-limits.mjs; a test run by
      # ci.yml fails if this copy and that file drift apart.
      - name: Check upload limits
        if: inputs.upload-limits != 'off' && endsWith(inputs.manifest-path, 'plugin.json')
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          UPLOAD_LIMITS: ${{ inputs.upload-limits }}
        run: |
          set -euo pipefail
          case "$UPLOAD_LIMITS" in
            error) mode=() ;;
            warn) mode=(--warn) ;;
            *) echo "::error::upload-limits must be error, warn or off (got '$UPLOAD_LIMITS')"; exit 1 ;;
          esac
          check="$RUNNER_TEMP/check-upload-limits.mjs"
          cat > "$check" <<'UPLOAD_LIMITS_EOF'
          #!/usr/bin/env node
          // Checks the limits that Claude's plugin upload validator enforces
          // (Customize > Plugins). A plugin that breaks one is rejected at upload even
          // when `claude plugin validate` passes, so validate-plugin-manifest.yml runs
          // this beside it. See devops-excellence#777 and ADR-038 decision 6.
          //
          // Ported from integral-productivity-coaching-claude-plugin#69. The limits come
          // from the upload validator's error text, not from a published spec.
          //
          //   plugin.json  description  <= 500 characters
          //   SKILL.md     name          present
          //   SKILL.md     description   present, <= 1024 characters
          //
          // Usage: node scripts/check-upload-limits.mjs [--warn] [plugin-root]
          //
          //   --warn  report violations as warnings and exit 0

          import { readFileSync, readdirSync, existsSync } from 'node:fs';
          import { join } from 'node:path';
          import { fileURLToPath } from 'node:url';

          export const PLUGIN_DESCRIPTION_MAX = 500;
          export const SKILL_DESCRIPTION_MAX = 1024;

          // Reads one scalar field from YAML frontmatter: plain, quoted, or a
          // folded (>) / literal (|) block. Enough for SKILL.md frontmatter, without
          // adding a YAML dependency.
          export function frontmatterField(text, field) {
            const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
            if (!m) return undefined;
            const lines = m[1].split(/\r?\n/);
            const i = lines.findIndex((l) => l.startsWith(`${field}:`));
            if (i === -1) return undefined;
            const rest = lines[i].slice(field.length + 1).trim();
            if (/^[>|][+-]?$/.test(rest)) {
              const block = [];
              for (const l of lines.slice(i + 1)) {
                if (l.trim() !== '' && !/^\s/.test(l)) break;
                block.push(l.trim());
              }
              const joiner = rest.startsWith('>') ? ' ' : '\n';
              return block.join(joiner).trim();
            }
            return rest.replace(/^(['"])(.*)\1$/, '$2');
          }

          export function check(root) {
            const errors = [];
            const manifestPath = join(root, '.claude-plugin', 'plugin.json');
            if (!existsSync(manifestPath)) {
              errors.push('.claude-plugin/plugin.json is missing');
            } else {
              const desc = JSON.parse(readFileSync(manifestPath, 'utf8')).description ?? '';
              if (desc.length > PLUGIN_DESCRIPTION_MAX) {
                errors.push(`.claude-plugin/plugin.json: description is ${desc.length} characters (max ${PLUGIN_DESCRIPTION_MAX})`);
              }
            }
            const skillsDir = join(root, 'skills');
            const skills = existsSync(skillsDir)
              ? readdirSync(skillsDir).filter((d) => existsSync(join(skillsDir, d, 'SKILL.md')))
              : [];
            for (const dir of skills) {
              const rel = `skills/${dir}/SKILL.md`;
              const text = readFileSync(join(skillsDir, dir, 'SKILL.md'), 'utf8');
              if (!frontmatterField(text, 'name')) errors.push(`${rel}: name is missing`);
              const desc = frontmatterField(text, 'description');
              if (!desc) errors.push(`${rel}: description is missing`);
              else if (desc.length > SKILL_DESCRIPTION_MAX) {
                errors.push(`${rel}: description is ${desc.length} characters (max ${SKILL_DESCRIPTION_MAX})`);
              }
            }
            return { errors, skillCount: skills.length };
          }

          if (process.argv[1] === fileURLToPath(import.meta.url)) {
            const args = process.argv.slice(2);
            const warn = args.includes('--warn');
            const root = args.find((a) => a !== '--warn') ?? '.';
            const { errors, skillCount } = check(root);
            if (errors.length) {
              const level = warn ? 'warning' : 'error';
              for (const e of errors) console.error(`::${level}::${e}`);
              console.error(`${errors.length} upload-limit violation(s).`);
              process.exit(warn ? 0 : 1);
            }
            console.log(`Upload limits OK: plugin.json and ${skillCount} skills.`);
          }
          UPLOAD_LIMITS_EOF
          root="$(dirname "$(dirname "$MANIFEST_PATH")")"
          node "$check" "${mode[@]}" "$root"
