          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NODE_AUTH_TOKEN is empty — npm ci will 401 on npm.pkg.github.com. If this is a Dependabot PR, add the registry token to the *Dependabot* secret store (Settings → Secrets and variables → Dependabot), which is separate from Actions secrets, or have the caller pass a fallback such as ${{ '${{' }} secrets.NODE_AUTH_TOKEN || secrets.DEPENDABOT_PACKAGES_TOKEN ${{ '}}' }}."
            exit 1
          fi

      - name: Install dependencies (npm)
        if: inputs.package-manager == 'npm'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm ci

      - name: Typecheck (pnpm)
        if: inputs.package-manager == 'pnpm'
        run: pnpm typecheck

      - name: Typecheck (npm)
        if: inputs.package-manager == 'npm'
        run: npm run typecheck

